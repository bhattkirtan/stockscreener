[pytest]
# The repo had no pytest config at all; these are the settings the suite was
# already being run with by hand.
testpaths = tests/unit
python_files = test_*.py
asyncio_mode = strict
addopts = -q

# Coverage is NOT in addopts on purpose: it roughly quadruples the run
# (~40s -> ~160s) and the inner loop is run constantly. CI should run
#
#     python3 -m pytest --cov
#
# which picks up source + fail_under from .coveragerc.
#
# WARNING: measure with --cov (bare) or --cov=<package>, never
# --cov=<dotted.module.path>. The dotted-module form makes coverage re-import
# that module, numpy gets loaded a second time ("The NumPy module was reloaded"),
# and the two numpy instances then fail against each other inside pandas with
# "TypeError: int() argument must be ... not '_NoValueType'". That shows up as
# ~47 unrelated test failures that vanish without --cov.
